[project]
name = "3rike-mobility-backend"
version = "0.1.0"
description = "Battery Swapping Demand Prediction Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pandas>=2.2.0",
    "boto3>=1.36.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.28.0"]

[project.scripts]
start = "app.main:start"
